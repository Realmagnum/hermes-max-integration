name: CI

on:
  push:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Pin released minimum Core 0.21.4 on Python 3.12 (it requires <3.14).
# The later baseline/current source fixtures use Python 3.14 and report
# package version 0.0.0. No dependency overrides are permitted.
env:
  CURRENT_CORE_SHA: ca13a7828acd2ba8c75e1c1d1694cbc1aee7df3f

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core:
          - label: minimum
            job-name: test-minimum-core
            sha: d337b736aa1e8ebecfab043842d13e4a2d2f48a3
            python: "3.12"
          - label: baseline
            job-name: test
            sha: d0288be5b3330d2442e3907185b8e9d0958297bb
            python: "3.14"
          - label: current
            job-name: test-current-core
            sha: ca13a7828acd2ba8c75e1c1d1694cbc1aee7df3f
            python: "3.14"
    name: ${{ matrix.core.job-name }} (Python ${{ matrix.core.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.core.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact Core and plugin
        env:
          CORE_SHA: ${{ matrix.core.sha }}
        run: |
          git init /tmp/hermes-core
          git -C /tmp/hermes-core remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-core fetch --no-tags --depth=1 origin "$CORE_SHA"
          git -C /tmp/hermes-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hermes-core rev-parse HEAD)" = "$CORE_SHA"
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/hermes-core -e ".[test,tables]"
          python -m pip check
      - name: Lint, tests and documentation contracts
        run: |
          ruff check adapter.py credential_support.py mixins/ scripts/ tests/
          python -m pytest -v --tb=short
          python scripts/check-doc-claims.py
          python scripts/check-config-reference.py
          python scripts/check-ru-en-parity.py
          python scripts/check_docs_links.py
      - name: Plugin admission including dependency installation
        shell: bash
        run: |
          hermes plugins validate "$GITHUB_WORKSPACE" --install-deps 2>&1 | tee /tmp/plugin-admission.log
          # Core currently catches PM preparation failures and proceeds with
          # validation in the old environment; its exit code alone is not proof
          # that --install-deps succeeded.
          ! grep -q 'dependency preparation failed:' /tmp/plugin-admission.log
          ! grep -q 'Python dependencies not installed' /tmp/plugin-admission.log
          python -m pip check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install scanner
        run: python -m pip install "bandit>=1.8,<2"
      - name: SAST scan of production modules
        run: bandit -r adapter.py credential_support.py mixins/ scripts/ -f txt -lll

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install exact current Core, plugin and audit tooling
        run: |
          git init /tmp/hermes-core
          git -C /tmp/hermes-core remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-core fetch --no-tags --depth=1 origin "$CURRENT_CORE_SHA"
          git -C /tmp/hermes-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hermes-core rev-parse HEAD)" = "$CURRENT_CORE_SHA"
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/hermes-core -e ".[test]" "pip-audit>=2.9,<3"
          python -m pip check
      - name: Audit Core plus plugin and test dependencies
        run: |
          python -m pip freeze
          pip-audit --desc --skip-editable
      - name: Install optional extras (stt, tables)
        if: always()
        run: |
          python -m pip install -e ".[stt,tables]"
          python -m pip check
      - name: Audit optional extras (stt, tables)
        if: always()
        run: |
          python -m pip freeze
          pip-audit --desc --skip-editable
