name: max-platform
label: Max
kind: platform
version: 2.11.0
requires_hermes: ">=0.21.4"
provides_hooks:
  - transform_llm_output
description: >
  MAX messenger (max.ru) gateway adapter for Hermes Agent with cross-platform
  session management and native Hermes Desktop sessions sidebar integration.
  Supports both long-polling and webhook. Downloads and caches voice messages;
  transcription is provided by the Hermes core STT pipeline (config.yaml → stt).
author: Realmagnum / Hermes Agent community
license: MIT
homepage: https://github.com/Realmagnum/hermes-max-integration

# Declared for the `hermes plugins install/update` hint (never auto-installed
# by Hermes by design). Table-as-image: playwright is the preferred HTML→PNG
# renderer, pillow the fallback. Browser binaries need a separate step:
#   python -m playwright install chromium   (~115 MB, one-time)
python_dependencies:
  - "aiohttp>=3.14.3,<4"
  - "httpx>=0.28.1,<0.29"
  - "playwright==1.62.0"
  - "pillow>=12.3,<13"
  - "wcwidth>=0.2,<1"

provides_locales:
  - id: ru
    endonym: Русский
    rtl: false
  - id: en
    endonym: English
    rtl: false

requires_env:
  - name: MAX_BOT_TOKEN
    description: "Bot token from MAX for Partners: Chat-bots → Advanced settings → Configure → Token"
    prompt: "Max bot token"
    url: "https://dev.max.ru/docs/chatbots/bots-create"
    password: true

optional_env:
  - name: MAX_WEBHOOK_URL
    description: "Public HTTPS endpoint enabling webhook mode; empty uses long polling"
    prompt: "Public webhook URL (optional)"
  - name: MAX_WEBHOOK_SECRET
    description: "Webhook secret for X-Max-Bot-Api-Secret verification"
    prompt: "Webhook secret (5-256 chars)"
    password: true
  - name: MAX_WEBHOOK_HOST
    description: "Local bind host for webhook server, default 0.0.0.0"
    prompt: "Webhook host"
  - name: MAX_WEBHOOK_PORT
    description: "Local bind port for webhook server, default 8646"
    prompt: "Webhook port"
  - name: MAX_WEBHOOK_PATH
    description: "Webhook path, default /max/webhook"
    prompt: "Webhook path"
  - name: MAX_ALLOWED_USERS
    description: "Comma-separated Max user IDs allowed to talk to the bot"
    prompt: "Allowed user IDs (comma-separated)"
  - name: MAX_ALLOW_ALL_USERS
    description: "Set to true to allow any Max user who messages the bot"
    prompt: "Allow all users (true/false)"
  - name: MAX_GROUP_POLICY
    description: "Group access: allowlist (default, empty lists deny), closed, or open; global user access still applies"
    prompt: "Group policy (allowlist/closed/open)"
  - name: MAX_GROUP_ALLOWED_USERS
    description: "Comma-separated numeric user IDs allowed in groups; configured user and chat lists must both match"
    prompt: "Allowed group user IDs"
  - name: MAX_GROUP_ALLOWED_CHATS
    description: "Comma-separated numeric group chat IDs, without chat: prefix; configured user and chat lists must both match"
    prompt: "Allowed group chat IDs"
  - name: MAX_HOME_CHANNEL
    description: "Default Max delivery target for cron/send_message, e.g. user:123 or chat:456"
    prompt: "Home channel (e.g. user:123)"
  - name: MAX_TABLE_AS_IMAGE
    description: "Render markdown tables as images via Pillow (true/false, default: false)"
    prompt: "Render tables as images"
  - name: MAX_CROSS_SESSION
    description: "Enable the owner-only session picker with buttons, including MAX-only listing (true/false, default: false)"
    prompt: "Owner-only session picker"
  - name: MAX_CROSS_SESSION_USERS
    description: "Comma-separated owner MAX user IDs for the picker and cross-platform search; never grants access to everyone"
    prompt: "Session picker owner IDs"
  - name: MAX_SESSIONS_LIMIT
    description: "Session list/search count, integer 1–20, default 10; invalid values use 10"
    prompt: "Session count (1–20)"
  - name: MAX_SESSIONS_DEFAULT_ALL
    description: "List all platforms for /sessions by default (true/false, default false)"
    prompt: "Show all platforms by default"
  - name: MAX_EDIT_THROTTLE
    description: "Minimum seconds between streaming edits of the same message (default: 0.2). Applies per chat/message; content queued inside the window is flushed automatically."
    prompt: "Streaming edit throttle in seconds (e.g. 0.2)"
