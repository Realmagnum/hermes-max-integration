name: CI

# Quality gates must cover every branch: the audit found that `push` was
# limited to `main`, so feature branches (and the PRs built from them) were
# never gated. `push:` without a branch filter runs on all branches; PRs stay
# gated against `main`.
#
# Workflow discovery on the Gitea instance used by this repo (1.26.4):
# `[actions] WORKFLOW_DIRS` defaults to `.gitea/workflows,.github/workflows`
# and "the first one to exist in a repo is used". This repo has no
# `.gitea/workflows`, so `.github/workflows` is the directory that is read —
# the path does not need to change. A CI run still requires a registered
# act_runner (instance/org/repo level); see BACKLOG BUILD-03 notes.
on:
  push:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Hermes Core 0.19 pins Pillow 12.2, while this plugin's supported
          # table renderer requires the audited 12.3+ release. Exercise that
          # compatible runtime combination in every release-gate test job.
          pip install --upgrade --no-deps "pillow>=12.3"

      - name: Lint with ruff (all production modules)
        run: |
          ruff check adapter.py mixins/ scripts/ tests/

      - name: Run tests
        run: |
          python -m pytest -v --tb=short
          python scripts/check-doc-claims.py
          python scripts/check-config-reference.py
          python scripts/check-ru-en-parity.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: SAST scan with bandit (all production modules)
        run: |
          pip install bandit
          bandit -r adapter.py mixins/ scripts/ -f txt -lll

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[dev]"
          # See the matching test-job note: Core's stale exact Pillow pin must
          # not mask the security floor used by this plugin.
          pip install --upgrade --no-deps "pillow>=12.3"

      - name: Audit runtime + dev dependencies
        run: |
          pip freeze
          # PyPI currently publishes Hermes core only as 0.19.0, which pins
          # cryptography==46.0.7. These six advisory IDs have no installable
          # fixed Core dependency yet; keep the exceptions narrow and remove
          # them when an upstream Core release supplies the fixed versions.
          pip-audit --desc --skip-editable --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554 --ignore-vuln GHSA-537c-gmf6-5ccf --ignore-vuln PYSEC-2026-3576 --ignore-vuln PYSEC-2026-3577

      # Optional extras pull heavy native packages (ctranslate2/onnxruntime for
      # STT, playwright for tables) that the base environment never installs.
      # `always()` keeps the extras audit running even when the base audit
      # already failed, so one run reports both environments.
      - name: Install optional extras (stt, tables)
        if: always()
        run: |
          pip install -e ".[stt,tables]"

      - name: Audit optional extras (stt, tables)
        if: always()
        run: |
          pip freeze
          pip-audit --desc --skip-editable --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554 --ignore-vuln GHSA-537c-gmf6-5ccf --ignore-vuln PYSEC-2026-3576 --ignore-vuln PYSEC-2026-3577
