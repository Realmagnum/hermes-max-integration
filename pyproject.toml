[project]
name = "hermes-max-integration"
# Mirror of plugin.yaml `version:` — plugin.yaml is the single source of truth
# (what Hermes displays and what scripts/release.sh reads). Enforced by
# scripts/check-doc-claims.py.
version = "2.10.2"
description = "Hermes Agent MAX messenger adapter with STT voice transcription"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Realmagnum / Hermes Agent community"}
]
dependencies = [
    "aiohttp>=3.14.3,<4",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0,<2"]
# Table-as-image: playwright is the primary HTML→PNG renderer; Pillow and
# wcwidth form its fallback. All are declared in plugin.yaml too.
tables = ["playwright==1.62.0", "pillow>=12.3,<13", "wcwidth>=0.2,<1"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-mock>=3.14,<4",
    "ruff>=0.6,<1",
    "PyYAML>=6.0.3,<7",
    # The test suite imports gateway.config and gateway.platforms.base.
    # Install the exact Core source fixture separately (see CI). Declaring
    # hermes-agent here makes the plugin depend on its own workspace root
    # under Hermes PM, even when the dev extra is not selected. PyPI 0.19
    # is stale and must not replace the application checkout.
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-mock>=3.14,<4",
    "ruff>=0.6,<1",
    "PyYAML>=6.0.3,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# The repo is a flat Hermes platform plugin: `adapter.py` plus the `mixins/`
# sub-package, which Hermes core loads as a directory plugin
# (`hermes_cli/plugins_loader.py` imports the plugin dir as
# `hermes_plugins.<slug>` via `__init__.py` and relative imports). Setuptools
# auto-discovery cannot be used here — the top-level `mixins/`, `skills/` and
# `assets/` directories trigger "Multiple top-level packages discovered".
# Declare the distribution contents explicitly instead.
[tool.setuptools]
py-modules = ["adapter", "ssl_support", "credential_support", "media_caption"]

[tool.setuptools.packages.find]
include = ["mixins*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
